{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria - Leitor de QR Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body id="body-bg" class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">

    <!-- TELA PRINCIPAL DO LEITOR -->
    <div id="main-card" class="max-w-md w-full bg-slate-800 rounded-3xl p-6 shadow-2xl text-center border border-slate-700">
        <h1 class="text-2xl font-black text-white mb-2 uppercase tracking-widest">Portaria Digital</h1>
        <p class="text-slate-400 text-sm mb-6">Aponte a câmera para o QR Code do aluno</p>

        <div id="reader" class="w-full bg-black rounded-xl overflow-hidden border-4 border-slate-700 mb-6"></div>

        <div id="resultado" class="hidden p-4 rounded-xl text-lg font-black uppercase tracking-widest animate-pulse">
        </div>

        <button onclick="reiniciarScanner()" class="mt-6 text-slate-400 hover:text-white underline text-sm">
            Reiniciar Leitor
        </button>
    </div>

    <!-- TELA GIGANTE DE CONFIRMAÇÃO (Fica oculta até ler o QR Code) -->
    <div id="fullscreen-result" class="hidden flex flex-col items-center justify-center text-center p-4 w-full h-full">
        <div id="result-icon" class="text-[120px] mb-4"></div>
        <h1 id="result-title" class="text-6xl font-black uppercase tracking-widest mb-4 drop-shadow-lg"></h1>
        <p id="result-msg" class="text-3xl font-bold drop-shadow-md mt-4 px-4"></p>
    </div>

    <script>
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
        let escaneando = true;

        function onScanSuccess(decodedText, decodedResult) {
            if (!escaneando) return;
            escaneando = false; // Trava o leitor

            html5QrcodeScanner.pause(true); // Pausa a câmera IMEDIATAMENTE

            const divResultado = document.getElementById('resultado');
            divResultado.classList.remove('hidden');
            divResultado.innerHTML = "PROCESSANDO...";
            divResultado.className = "p-4 rounded-xl text-lg font-black uppercase tracking-widest bg-blue-500 text-white mt-4 animate-pulse";

            // Dispara o código para o nosso views.py
            fetch("{% url 'portaria_checkin' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ codigo_ingresso: decodedText })
            })
                .then(response => response.json())
                .then(data => {
                    // Esconde a caixinha do leitor e prepara a tela gigante colorida
                    document.getElementById('main-card').classList.add('hidden');
                    const fullscreen = document.getElementById('fullscreen-result');
                    const bodyBg = document.getElementById('body-bg');
                    const icon = document.getElementById('result-icon');
                    const title = document.getElementById('result-title');
                    const msg = document.getElementById('result-msg');

                    fullscreen.classList.remove('hidden');
                    
                    if (data.status === 'sucesso') {
                        bodyBg.className = "bg-green-500 text-white min-h-screen flex flex-col items-center justify-center p-4";
                        icon.innerHTML = "✅";
                        title.innerHTML = "LIBERADO!";
                    } else if (data.status === 'aviso') {
                        bodyBg.className = "bg-yellow-400 text-yellow-900 min-h-screen flex flex-col items-center justify-center p-4";
                        icon.innerHTML = "⚠️";
                        title.innerHTML = "JÁ LIDO!";
                    } else {
                        bodyBg.className = "bg-red-600 text-white min-h-screen flex flex-col items-center justify-center p-4";
                        icon.innerHTML = "❌";
                        title.innerHTML = "INVÁLIDO!";
                    }
                    
                    msg.innerHTML = data.mensagem;

                    // A MÁGICA: A tela inteira fica da cor do aviso por 3 segundos inteiros e depois volta pra câmera sozinha
                    setTimeout(reiniciarScanner, 3000);
                });
        }

        function reiniciarScanner() {
            // Volta a cor de fundo original
            const bodyBg = document.getElementById('body-bg');
            bodyBg.className = "bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300";
            
            // Esconde o textão gigante e volta a mostrar a câmera
            document.getElementById('fullscreen-result').classList.add('hidden');
            document.getElementById('main-card').classList.remove('hidden');
            
            // Limpa o aviso de "processando"
            document.getElementById('resultado').classList.add('hidden');
            
            escaneando = true;
            html5QrcodeScanner.resume(); // Religa a câmera para o próximo da fila
        }

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>

</html>
